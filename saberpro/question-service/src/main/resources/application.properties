spring.application.name=question-service
server.port=8083

validation.service.url=http://localhost:8082/validate

spring.datasource.url=jdbc:h2:mem:questionsdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.jpa.show-sql=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

saberpro.amqp.exchange=saberpro.direct.exchange
saberpro.amqp.routing-key=question.submit
saberpro.amqp.queue=question.submit.review.queue
